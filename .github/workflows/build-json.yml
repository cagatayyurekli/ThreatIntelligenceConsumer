      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild .\ThreatIntelligenceConsumer\ThreatIntelligenceConsumer.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64

      - name: Verify named-session capture with synthetic ETW events
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Recurse -Filter ThreatIntelligenceConsumer.exe |
              Where-Object FullName -Match '\\x64\\Release\\' | Select-Object -First 1
          if (-not $exe) { throw 'Release executable missing.' }

          # Isolated Windows runner only: use a synthetic provider, not a Defender provider.
          $session = '0MyThreatIntelTrace'
          $output = Join-Path $env:RUNNER_TEMP 'standard-etw-smoke.ndjson'
          $missingOutput = Join-Path $env:RUNNER_TEMP 'missing-session-smoke.ndjson'
          $provider = [Guid]::NewGuid()
          $marker = 'NamedSessionSmoke-' + [Guid]::NewGuid().ToString('N')
          $running = $false
          $consumer = $null
          $registration = [UInt64]0

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class SyntheticEtw {
              [DllImport("advapi32.dll", ExactSpelling=true)]
              public static extern uint EventRegister(ref Guid id, IntPtr callback, IntPtr context, out ulong handle);
              [DllImport("advapi32.dll", ExactSpelling=true, CharSet=CharSet.Unicode)]
              public static extern uint EventWriteString(ulong handle, byte level, ulong keyword, string message);
              [DllImport("advapi32.dll", ExactSpelling=true)]
              public static extern uint EventUnregister(ulong handle);
          }
          '@

          function Start-Consumer([string]$path) {
              $info = [Diagnostics.ProcessStartInfo]::new($exe.FullName)
              $info.ArgumentList.Add($path)
              $info.UseShellExecute = $false
              $info.RedirectStandardOutput = $true
              $info.RedirectStandardError = $true
              $info.RedirectStandardInput = $true
              return [Diagnostics.Process]::Start($info)
          }

          # A missing named session must fail without guessing a protected session ID.
          $missing = Start-Consumer $missingOutput
          if (-not $missing.WaitForExit(10000)) { $missing.Kill(); throw 'Missing-session test hung.' }
          $missingLog = $missing.StandardOutput.ReadToEnd()
          Write-Host $missingLog
          if ($missing.ExitCode -eq 0 -or $missingLog -notmatch 'no logger-ID fallback attempted' -or
              (Test-Path $missingOutput)) { throw 'Missing-session behavior failed.' }

          try {
              logman create trace $session -p $provider.ToString('B') '0xffffffffffffffff' 255 -rt -ets
              if ($LASTEXITCODE -ne 0) { throw 'Could not create synthetic real-time session.' }
              $running = $true
              $status = [SyntheticEtw]::EventRegister([ref]$provider, [IntPtr]::Zero, [IntPtr]::Zero, [ref]$registration)
              if ($status -ne 0) { throw "EventRegister failed: $status" }
              $consumer = Start-Consumer $output
              if ($consumer.WaitForExit(2000)) { throw 'Consumer exited before synthetic events were emitted.' }
              1..5 | ForEach-Object {
                  $status = [SyntheticEtw]::EventWriteString($registration, 4, 1, $marker)
                  if ($status -ne 0) { throw "EventWriteString failed: $status" }
                  Start-Sleep -Milliseconds 200
              }
              logman stop $session -ets
              if ($LASTEXITCODE -ne 0) { throw 'Could not stop synthetic session.' }
              $running = $false
              if (-not $consumer.WaitForExit(15000)) { throw 'Consumer failed to exit when session stopped.' }
              $log = $consumer.StandardOutput.ReadToEnd()
              Write-Host $log
              if ($consumer.ExitCode -ne 0) { throw "Consumer failed: $($consumer.ExitCode)" }
              if ($log -notmatch 'Using standard ETW consumption; no ControlTrace hook' -or
                  $log -match 'Heuristic logger ID selected') { throw 'Wrong consumer path used.' }
              $markerHex = [Convert]::ToHexString([Text.Encoding]::Unicode.GetBytes($marker)).ToLowerInvariant()
              $rows = @(Get-Content $output | ForEach-Object { $_ | ConvertFrom-Json } |
                  Where-Object { $_.provider_guid -eq $provider.ToString('B') -and $_.user_data_hex.Contains($markerHex) })
              if ($rows.Count -ne 5) { throw "Expected five synthetic marker events; received $($rows.Count)." }
              Write-Host 'PASS: named standard ETW session delivered five marker events; missing session failed cleanly.'
              Write-Host 'This smoke test does not verify delivery from the three Defender providers.'
          } finally {
              if ($registration -ne 0) { [void][SyntheticEtw]::EventUnregister($registration) }
              if ($running) { logman stop $session -ets }
              if ($consumer -and -not $consumer.HasExited) {
                  if (-not $consumer.WaitForExit(5000)) { $consumer.Kill() }
              }
          }

      - name: Verify TDH imports
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter ThreatIntelligenceConsumer.exe |
            Where-Object FullName -Match '\\x64\\Release\\' |
            Select-Object -First 1

          if (-not $exe) {
            throw 'Release x64 executable was not produced.'
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Visual Studio locator was not found.'
          }

          $dumpbin = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
            Select-Object -First 1

          if (-not $dumpbin -or -not (Test-Path $dumpbin)) {
            throw 'Visual Studio dumpbin.exe was not found.'
          }

          $imports = & $dumpbin /imports $exe.FullName | Out-String
          if ($imports -notmatch '(?i)tdh\.dll' -or
              $imports -notmatch 'TdhGetEventInformation' -or
              $imports -notmatch 'TdhFormatProperty') {
            throw 'The executable does not contain the expected TDH imports.'
          }

          $imports | Select-String -Pattern '(?i)tdh\.dll|TdhGetEventInformation|TdhGetProperty|TdhFormatProperty'

      - name: Stage executable and provenance
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter ThreatIntelligenceConsumer.exe |
            Where-Object FullName -Match '\\x64\\Release\\' |
            Select-Object -First 1

          if (-not $exe) {
            throw 'Release x64 executable was not produced.'
          }

          $staging = Join-Path $env:RUNNER_TEMP 'ThreatIntelligenceConsumer-x64-sense-three-providers'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          $outputExe = Join-Path $staging 'ThreatIntelligenceConsumer-json.exe'
          Copy-Item $exe.FullName $outputExe
          Copy-Item (Join-Path $env:RUNNER_TEMP 'json-output.patch') $staging
          Copy-Item .\profiles\sense-three-providers.reg $staging
          Copy-Item .\profiles\README.md (Join-Path $staging 'CAPTURE_INSTRUCTIONS.md')

          $hash = Get-FileHash $outputExe -Algorithm SHA256
          $hash.Hash | Set-Content (Join-Path $staging 'SHA256.txt') -Encoding ascii

          @(
            "Source repository: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
            "Source commit: $env:GITHUB_SHA"
            'Base upstream commit: bcaa3e2c10d6aea0b78dc5a8b6142cac37eb585c'
            "Built UTC: $([DateTime]::UtcNow.ToString('o'))"
            'Platform: Release x64'
            'Profile: sense-three-providers.reg; import and reboot before capture'
            'Profile scope: Sense.Client, DefenderCore1DS, Sense.GeneratedETW only'
            'Decoder scope: every provider configured under 0MyThreatIntelTrace'
            'Runtime delivery from Defender providers: not established by this build'
            'Session selection: query 0MyThreatIntelTrace by name before the original protected-session fallback'
            'Diagnostics: named query status, fallback identity warning, ProcessTrace error as exit code'
            'Validation: five synthetic ETW events received through standard consumption; missing session fails cleanly'
            'Retest: existing three-provider registry profile is unchanged; replace EXE and rerun elevated'
            'Payload decoding: TDH metadata with bounded property and array handling'
            'Fallback decoding: conservative counted UTF-16 strings when TDH metadata is unavailable'
            'Raw preservation: user_data_hex and extended_data remain in every event record'
            'Default output: ti-events.ndjson in the current directory'
            'Custom output: ThreatIntelligenceConsumer-json.exe C:\path\events.ndjson'
          ) | Set-Content (Join-Path $staging 'BUILD_INFO.txt') -Encoding utf8

          Get-Item $outputExe | Format-List FullName,Length,LastWriteTimeUtc
          $hash | Format-List Algorithm,Hash,Path

      - name: Upload x64 decoder and three-provider capture profile
        uses: actions/upload-artifact@v4
        with:
          name: ThreatIntelligenceConsumer-x64-sense-three-providers
          path: ${{ runner.temp }}\ThreatIntelligenceConsumer-x64-sense-three-providers
          if-no-files-found: error
          retention-days: 7
