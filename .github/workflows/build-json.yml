          [IO.File]::WriteAllBytes(
            $patchPath,
            [Convert]::FromBase64String(($patchBase64 -replace '\s', ''))
          )
          git apply --check $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'NDJSON patch validation failed.' }
